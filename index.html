<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Dashboard</title>
  <style>
    :root {
      --bg: #eceef1;
      --frame-bg: #ffffff;
      --frame-border: #d8dce3;
      --text: #1c1c1e;
      --muted: #6b7280;
      --light-muted: #9ca3af;
      --panel-border: #e8eaed;
      --header-bg: #f7f8fa;
      --accent: #e11d48;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --green: #059669;
      --orange: #d97706;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.04);
    }
    body.dark {
      --bg: #0c0c0e;
      --frame-bg: #18181b;
      --frame-border: #27272a;
      --text: #f4f4f5;
      --muted: #b4b4be;
      --light-muted: #8b8b96;
      --panel-border: #27272a;
      --header-bg: #1f1f23;
      --accent: #fb7185;
      --blue: #60a5fa;
      --blue-soft: #1e3a5f;
      --green: #34d399;
      --orange: #fbbf24;
      --card-shadow: none;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px;
      line-height: 1.35;
      transition: background 0.3s, color 0.3s;
    }
    body.locked {
      background: #e4e6ea;
    }
    body.dark.locked {
      background: #08080a;
    }
    .frame {
      max-width: 960px;
      margin: 0 auto;
      background: var(--frame-bg);
      border: 3px solid var(--frame-border);
      border-radius: 10px;
      box-shadow: var(--card-shadow);
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    body.locked .frame {
      border-color: var(--muted);
      opacity: 0.98;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--panel-border);
      background: var(--header-bg);
    }
    header h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.4px; }
    .meta { display: flex; gap: 12px; font-size: 0.88rem; align-items: center; }
    .toggle-btn {
      background: none; border: 1px solid var(--panel-border); color: var(--text);
      border-radius: 8px; padding: 4px 10px; font-size: 0.82rem; cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
    }
    .panel {
      padding: 14px 16px;
      border-bottom: 1px solid var(--panel-border);
    }
    .panel:nth-child(odd) { border-right: 1px solid var(--panel-border); }

    /* ===== Calendar Widget Style ===== */
    .cal-widget {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
    }
    .cal-left {
      flex: 0 0 auto;
      min-width: 90px;
    }
    .cal-weekday {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.15;
    }
    .cal-daynum {
      font-size: 3.4rem;
      font-weight: 700;
      line-height: 1;
      margin: 2px 0 4px;
      color: var(--text);
    }
    .cal-events-preview {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .header-clock {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
      min-width: 3.2em;
      text-align: right;
    }
    .cal-right {
      flex: 1;
    }
    .cal-month {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      text-align: left;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px 0;
      text-align: center;
      font-size: 0.72rem;
    }
    .cal-grid .dow {
      color: var(--light-muted);
      font-weight: 500;
      padding-bottom: 4px;
    }
    .cal-grid .day {
      padding: 4px 0;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      line-height: 16px;
      margin: 0 auto;
      color: var(--text);
    }
    .cal-grid .day.other { color: var(--light-muted); opacity: 0.45; }
    .cal-grid .day.today {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .events-list {
      margin-top: 10px;
      border-top: 1px solid var(--panel-border);
      padding-top: 10px;
    }
    .event-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 8px;
      font-size: 0.88rem;
    }
    .event-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--blue);
      margin-top: 6px;
      flex-shrink: 0;
    }
    .event-item.cancelled .event-dot { background: var(--light-muted); }
    .event-item.cancelled .event-title {
      color: var(--light-muted);
      text-decoration: line-through;
    }
    .event-time {
      font-weight: 600;
      color: var(--blue);
      min-width: 90px;
      font-size: 0.82rem;
    }
    .event-title { color: var(--text); }

    /* ===== Shuttle ===== */
    .shuttle-block { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--panel-border); }
    .shuttle-block:last-of-type { margin-bottom: 2px; padding-bottom: 0; border-bottom: none; }
    .panel h2 {
      font-size: 0.62rem; font-weight: 600; color: var(--light-muted);
      text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .shuttle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .next-time {
      font-size: 2.15rem; font-weight: 700; line-height: 1.05; margin: 1px 0 2px;
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }
    .next-sub { font-size: 0.78rem; color: var(--muted); }
    .route {
      font-size: 0.82rem; font-weight: 600;
      text-align: right; white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      border-bottom: 1px dashed transparent;
      user-select: none;
    }
    .route:hover { border-bottom-color: var(--blue); color: var(--blue); }
    .updated { font-size: 0.65rem; color: var(--light-muted); margin-top: 6px; }
    .refresh-btn {
      background: none; border: 1px solid var(--panel-border); color: var(--muted);
      border-radius: 50%; width: 22px; height: 22px; font-size: 0.85rem;
      cursor: pointer; line-height: 1; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .refresh-btn:hover { color: var(--text); border-color: var(--muted); }
    .cal-status {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.7rem; color: var(--light-muted); margin-top: 6px;
    }
    [contenteditable="true"] {
      outline: none; border-bottom: 1px dashed transparent;
      min-width: 1.5em;
    }
    [contenteditable="true"]:focus {
      border-bottom-color: var(--blue);
      background: var(--blue-soft);
    }

    /* ===== Countdown ===== */
    .countdown-row {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .countdown-left { display: flex; flex-direction: column; gap: 2px; }
    .countdown-label { font-size: 0.85rem; font-weight: 500; color: var(--text); }
    .countdown-days { font-size: 1.55rem; font-weight: 700; color: var(--orange); font-variant-numeric: tabular-nums; }
    .countdown-unit { font-size: 0.72rem; color: var(--light-muted); margin-left: 2px; }
    .date-input.hidden-date {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }
    .countdown-days-wrap {
      cursor: pointer;
      border-bottom: 1px dashed transparent;
    }
    .countdown-days-wrap:hover {
      border-bottom-color: var(--orange);
    }
    .countdown-del {
      background: none; border: none; color: var(--light-muted);
      cursor: pointer; font-size: 0.85rem; padding: 0 4px;
      line-height: 1;
    }
    .countdown-del:hover { color: var(--accent); }
    body.locked .unlock-only { display: none !important; }
    body.locked [contenteditable="true"] { pointer-events: none; border-bottom-color: transparent !important; }
    body.locked .countdown-days-wrap { pointer-events: none; cursor: default; }
    body.locked .route { pointer-events: none; cursor: default; border-bottom-color: transparent !important; }
    body.locked .countdown-del { display: none !important; }
    body.locked #lockBtn { opacity: 0.7; }

    /* ===== Weather ===== */
    .weather-main { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .weather-icon-big {
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .weather-icon-big svg { width: 48px; height: 48px; display: block; }
    .fd-icon svg { width: 22px; height: 22px; display: block; margin: 0 auto; }
    .temp { font-size: 1.85rem; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .weather-warning {
      font-size: 0.72rem;
      color: var(--accent);
      margin-top: 6px;
      line-height: 1.3;
      display: none;
    }
    .weather-warning.show { display: block; }
    .weather-details {
      font-size: 0.8rem; color: var(--muted);
      display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px;
    }
    .forecast-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--panel-border);
      overflow-x: auto;
    }
    .forecast-day {
      flex: 1;
      min-width: 52px;
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .forecast-day .fd-week { font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .forecast-day .fd-temp { font-weight: 600; color: var(--text); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .forecast-day .fd-icon {
      font-size: 1.15rem; margin: 3px 0;
      width: 1.5em; height: 1.5em;
      display: flex; align-items: center; justify-content: center;
      margin-left: auto; margin-right: auto;
    }

    /* ===== Responsive ===== */
    @media (max-width: 720px) {
      body { padding: 8px; }
      .frame { border-width: 2px; border-radius: 8px; }
      .grid { grid-template-columns: 1fr; }
      .panel:nth-child(odd) { border-right: none; }
      .panel { padding: 14px 14px; }
      header { padding: 10px 14px; }
      header h1 { font-size: 0.95rem; }

      /* Calendar */
      .cal-widget { flex-direction: column; gap: 12px; }
      .cal-left { min-width: auto; }
      .cal-daynum { font-size: 2.6rem; }
      .cal-month { text-align: left; margin-bottom: 2px; }
      .cal-grid .day { width: 28px; height: 28px; line-height: 20px; font-size: 0.78rem; }

      /* Shuttle */
      .shuttle-row { gap: 8px; }
      .next-time { font-size: 1.85rem; }
      .route { font-size: 0.78rem; }

      /* Countdown & Weather */
      .countdown-days { font-size: 1.5rem; }
      .temp { font-size: 2rem; }
      .weather-details { font-size: 0.78rem; }
    }

    @media (max-width: 400px) {
      .cal-daynum { font-size: 2.2rem; }
      .next-time { font-size: 1.7rem; }
      .route { font-size: 0.72rem; }
      .cal-grid .day { width: 24px; height: 24px; font-size: 0.7rem; }
      .meta { gap: 8px; font-size: 0.8rem; }
    }

    @media (min-width: 721px) and (max-width: 900px) {
      .grid { grid-template-columns: 1.1fr 1fr; }
      .next-time { font-size: 1.9rem; }
      .route { font-size: 0.78rem; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header>
      <h1>FAMILY DASHBOARD</h1>
      <div class="meta">
        <div class="header-clock" id="calClock">--:--</div>
        <button class="toggle-btn unlock-only" id="themeBtn" onclick="toggleTheme()" title="切換深色/淺色">🌙</button>
        <button class="toggle-btn" id="lockBtn" onclick="toggleLock()" title="鎖定/解鎖">🔓</button>
      </div>
    </header>

    <div class="grid">
      <div class="panel">
        <div class="cal-widget">
          <div class="cal-left">
            <div class="cal-weekday" id="calWeekday">...</div>
            <div class="cal-month" id="calMonth">...</div>
            <div class="cal-daynum" id="calDayNum">-</div>
            <div class="cal-events-preview" id="calPreview">...</div>
          </div>
          <div class="cal-right">
            <div class="cal-grid" id="calGrid"></div>
          </div>
        </div>
        <div class="events-list" id="schedule">
          <!-- events injected here -->
        </div>
        <div class="cal-status">
          <span id="calStatus">同步中...</span>
          <button class="refresh-btn unlock-only" onclick="tryLoadCalendar()" title="手動更新日曆">↻</button>
        </div>
      </div>

      <div class="panel">
        <h2>TODAY WEATHER · 香港天文台 <button class="refresh-btn unlock-only" onclick="updateWeather()" title="手動更新">↻</button></h2>
        <div class="weather-main">
          <div class="weather-icon-big" id="weatherIcon"></div>
          <div class="temp" id="temp">--°</div>
          <div>
            <div id="weatherDesc">Loading...</div>
            <div style="font-size:0.78rem;color:var(--muted);" id="feels">沙田 / 更新中</div>
          </div>
        </div>
        <div class="weather-details">
          <div>💧 濕度 <span id="humidity">--%</span></div>
          <div>☀️ UV <span id="uv">--</span></div>
          <div>🌧️ 雨量 <span id="rain">-- mm</span></div>
          <div>🕐 <span id="wxUpdate">--</span></div>
        </div>
        <div class="weather-warning" id="weatherWarning"></div>
        <div class="forecast-row" id="forecastRow"></div>
      </div>

      <div class="panel">
        <h2>COUNTDOWNS <button class="refresh-btn unlock-only" onclick="addCountdown()" title="新增">+</button></h2>
        <div id="countdownList"></div>
      </div>

      <div class="panel">
        <div class="shuttle-block">
          <h2>NEXT SHUTTLE · NR824</h2>
          <div class="shuttle-row">
            <div>
              <div class="next-time" id="next824">--:--</div>
              <div class="next-sub" id="range824">Then --:--</div>
            </div>
            <div class="route" id="route824" onclick="toggleRoute('824')" title="點擊切換方向">聽濤雅苑 → 馬鞍山廣場</div>
          </div>
        </div>
        <div class="shuttle-block">
          <h2>NEXT SHUTTLE · NR823</h2>
          <div class="shuttle-row">
            <div>
              <div class="next-time" id="next823">--:--</div>
              <div class="next-sub" id="range823">Then --:--</div>
            </div>
            <div class="route" id="route823" onclick="toggleRoute('823')" title="點擊切換方向">聽濤雅苑 → 鑽石山站</div>
          </div>
        </div>
        <div class="updated" id="updated">Updated --:--</div>
      </div>
    </div>
  </div>

  <script>
    // ==================== 可修改區域 ====================
    const GOOGLE_CAL_PROXY_URL = 'https://script.google.com/macros/s/AKfycbyqnIfhXlTiMBPE7Rxk4sE1g58BdX1wTNl9eCafjn0XsNxjeP4G0eejLw8FazUf3YYW/exec';

    // ==================== NR824 / NR823 規則 ====================
    const nr824Rules = [
      { start: [7,30], end: [9,30], interval: 20 },
      { start: [9,30], end: [13,0], interval: 30 },
      { start: [14,0], end: [17,0], interval: 20 },
      { start: [18,0], end: [19,0], interval: 20 },
      { start: [19,0], end: [23,0], interval: 30 }
    ];
    const nr823Weekday = [
      { start: [6,40], end: [9,0], interval: 10 },
      { start: [9,0], end: [11,0], interval: 30 },
      { start: [11,0], end: [12,0], interval: 60 },
      { start: [12,0], end: [15,0], interval: 30 },
      { start: [15,0], end: [16,0], interval: 60 },
      { start: [16,0], end: [17,0], interval: 30 },
      { start: [17,30], end: [20,0], interval: 15 }
    ];
    const nr823Saturday = [
      { start: [9,0], end: [11,0], interval: 30 },
      { start: [11,0], end: [12,0], interval: 60 },
      { start: [12,0], end: [15,0], interval: 30 },
      { start: [15,0], end: [16,0], interval: 60 },
      { start: [16,0], end: [20,0], interval: 30 }
    ];

    // ==================== 主題 ====================
    function toggleTheme() {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      try {
        localStorage.setItem('dashboard-theme', isDark ? 'dark' : 'light');
      } catch (e) {}
      document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
    }
    try {
      if (localStorage.getItem('dashboard-theme') === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('themeBtn').textContent = '☀️';
      }
    } catch (e) {}

    // ==================== 日曆 Widget ====================
    const WEEKDAYS = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
    const MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
    const DOW = ['S','M','T','W','T','F','S'];

    function renderCalendarWidget() {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth();
      const d = now.getDate();
      const weekday = now.getDay();

      document.getElementById('calWeekday').textContent = WEEKDAYS[weekday];
      document.getElementById('calDayNum').textContent = d;
      document.getElementById('calMonth').textContent = MONTHS[m];

      // Mini month grid
      const firstDay = new Date(y, m, 1).getDay(); // 0=Sun
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const prevDays = new Date(y, m, 0).getDate();

      let html = DOW.map(d => `<div class="dow">${d}</div>`).join('');

      // previous month padding
      for (let i = firstDay - 1; i >= 0; i--) {
        html += `<div class="day other">${prevDays - i}</div>`;
      }
      // current month
      for (let i = 1; i <= daysInMonth; i++) {
        const cls = i === d ? 'day today' : 'day';
        html += `<div class="${cls}">${i}</div>`;
      }
      // next month padding to fill 6 rows if needed
      const totalCells = firstDay + daysInMonth;
      const remaining = (7 - (totalCells % 7)) % 7;
      for (let i = 1; i <= remaining; i++) {
        html += `<div class="day other">${i}</div>`;
      }

      document.getElementById('calGrid').innerHTML = html;
    }

    // ==================== 班次計算 ====================
    function timeToMinutes(h, m) { return h * 60 + m; }
    function generateDepartures(rules) {
      const times = [];
      rules.forEach(rule => {
        let mins = timeToMinutes(...rule.start);
        const endMins = timeToMinutes(...rule.end);
        while (mins <= endMins) {
          const h = Math.floor(mins / 60);
          const m = mins % 60;
          times.push({ h, m, str: String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') });
          mins += rule.interval;
        }
      });
      return [...new Map(times.map(t => [t.str, t])).values()]
        .sort((a,b) => (a.h*60+a.m) - (b.h*60+b.m));
    }
    function getNextFromRules(rules, offsetMin) {
      offsetMin = offsetMin || 0;
      const nowMins = new Date().getHours() * 60 + new Date().getMinutes();
      const upcoming = generateDepartures(rules).map(t => {
        let mins = t.h * 60 + t.m + offsetMin;
        if (mins >= 24 * 60) mins -= 24 * 60;
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return { h, m, str: String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') };
      }).filter(t => (t.h * 60 + t.m) > nowMins)
        .sort((a, b) => (a.h * 60 + a.m) - (b.h * 60 + b.m));
      return { next: upcoming[0] || null, following: upcoming.slice(1, 3) };
    }
    function renderShuttle(timeId, rangeId, result) {
      if (!result.next) {
        document.getElementById(timeId).textContent = 'Ended';
        document.getElementById(rangeId).textContent = '今日服務已完結';
        return;
      }
      document.getElementById(timeId).textContent = result.next.str;
      if (result.following.length >= 2) {
        document.getElementById(rangeId).textContent = 'Then ' + result.following[0].str + ' · ' + result.following[1].str;
      } else if (result.following.length === 1) {
        document.getElementById(rangeId).textContent = 'Then ' + result.following[0].str;
      } else {
        document.getElementById(rangeId).textContent = 'Last bus';
      }
    }
    // 方向 0=屋苑開出，1=回程（車程偏移估算）
    const ROUTE_LABELS = {
      '824': ['聽濤雅苑 → 馬鞍山廣場', '馬鞍山廣場 → 聽濤雅苑'],
      '823': ['聽濤雅苑 → 鑽石山站', '鑽石山站 → 聽濤雅苑']
    };
    const ROUTE_OFFSET = { '824': 12, '823': 20 };
    let routeDir = { '824': 0, '823': 0 };

    function toggleRoute(id) {
      routeDir[id] = routeDir[id] === 0 ? 1 : 0;
      const el = document.getElementById('route' + id);
      if (el) el.textContent = ROUTE_LABELS[id][routeDir[id]];
      try {
        localStorage.setItem('dashboard-routes', JSON.stringify(routeDir));
      } catch (e) {}
      updateShuttles(); // 立即重算時間
    }
    function loadRoutes() {
      try {
        const saved = JSON.parse(localStorage.getItem('dashboard-routes') || '{}');
        if (saved['824'] === 0 || saved['824'] === 1) routeDir['824'] = saved['824'];
        if (saved['823'] === 0 || saved['823'] === 1) routeDir['823'] = saved['823'];
      } catch (e) {}
      const el824 = document.getElementById('route824');
      const el823 = document.getElementById('route823');
      if (el824) el824.textContent = ROUTE_LABELS['824'][routeDir['824']];
      if (el823) el823.textContent = ROUTE_LABELS['823'][routeDir['823']];
    }
    function updateShuttles() {
      const day = new Date().getDay();
      const off824 = routeDir['824'] ? ROUTE_OFFSET['824'] : 0;
      renderShuttle('next824', 'range824', getNextFromRules(nr824Rules, off824));
      if (isNr823NoService()) {
        document.getElementById('next823').textContent = '無服務';
        document.getElementById('range823').textContent = day === 0 ? '星期日不設服務' : '公眾假期不設服務';
      } else {
        const rules823 = day === 6 ? nr823Saturday : nr823Weekday;
        const off823 = routeDir['823'] ? ROUTE_OFFSET['823'] : 0;
        renderShuttle('next823', 'range823', getNextFromRules(rules823, off823));
      }
      const now = new Date();
      document.getElementById('updated').textContent =
        'Updated ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }

    // ==================== 香港公眾假期 2026（政府憲報） ====================
    const HK_HOLIDAYS_2026 = [
      '2026-01-01','2026-02-17','2026-02-18','2026-02-19',
      '2026-04-03','2026-04-04','2026-04-06','2026-04-07',
      '2026-05-01','2026-05-25','2026-06-19','2026-07-01',
      '2026-09-26','2026-10-01','2026-10-19','2026-12-25','2026-12-26'
    ];
    function localDateKey(d) {
      return d.getFullYear() + '-' +
        String(d.getMonth()+1).padStart(2,'0') + '-' +
        String(d.getDate()).padStart(2,'0');
    }
    function isPublicHoliday(d) {
      return HK_HOLIDAYS_2026.includes(localDateKey(d || new Date()));
    }
    function isNr823NoService(d) {
      d = d || new Date();
      return d.getDay() === 0 || isPublicHoliday(d);
    }

    // ==================== 倒數（可增刪，最多 4 項） ====================
    const MAX_COUNTDOWNS = 4;
    let countdowns = [
      { id: 'c1', label: 'BACK TO SCHOOL', date: '2026-08-13' },
      { id: 'c2', label: 'INFLIXIMAB', date: '2026-08-21' }
    ];
    function daysUntil(dateStr) {
      if (!dateStr) return '--';
      const target = new Date(dateStr + 'T00:00:00');
      const today = new Date(); today.setHours(0,0,0,0);
      const diff = Math.ceil((target - today) / 86400000);
      return diff < 0 ? 0 : diff;
    }
    function loadCountdowns() {
      try {
        const saved = JSON.parse(localStorage.getItem('dashboard-countdowns-v2') || 'null');
        if (Array.isArray(saved) && saved.length) countdowns = saved;
      } catch(e) {}
      renderCountdowns();
    }
    function saveCountdowns() {
      try {
        localStorage.setItem('dashboard-countdowns-v2', JSON.stringify(countdowns));
      } catch(e) {}
    }
    function renderCountdowns() {
      // 按剩餘天數排序（少的在上）
      const sorted = [...countdowns].sort((a, b) => {
        const da = daysUntil(a.date), db = daysUntil(b.date);
        return (typeof da === 'number' ? da : 9999) - (typeof db === 'number' ? db : 9999);
      });
      const list = document.getElementById('countdownList');
      list.innerHTML = sorted.map(item => {
        const days = daysUntil(item.date);
        return `<div class="countdown-row" data-id="${item.id}">
          <div class="countdown-left">
            <span class="countdown-label" contenteditable="true" data-id="${item.id}">${item.label}</span>
            <input type="date" class="date-input hidden-date" data-id="${item.id}" value="${item.date || ''}">
          </div>
          <span style="display:flex;align-items:center;gap:4px;">
            <span class="countdown-days-wrap" data-id="${item.id}">
              <span class="countdown-days">${days}</span><span class="countdown-unit">DAYS</span>
            </span>
            <button class="countdown-del unlock-only" data-id="${item.id}" title="刪除">×</button>
          </span>
        </div>`;
      }).join('');
      // 綁定事件
      list.querySelectorAll('.countdown-label').forEach(el => {
        el.addEventListener('blur', () => {
          const id = el.dataset.id;
          const item = countdowns.find(c => c.id === id);
          if (item) { item.label = el.textContent.trim() || 'EVENT'; saveCountdowns(); }
        });
        el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
      });
      list.querySelectorAll('.date-input').forEach(el => {
        el.addEventListener('change', () => {
          const id = el.dataset.id;
          const item = countdowns.find(c => c.id === id);
          if (item) { item.date = el.value; saveCountdowns(); renderCountdowns(); }
        });
      });
      list.querySelectorAll('.countdown-days-wrap').forEach(el => {
        el.addEventListener('click', () => {
          if (document.body.classList.contains('locked')) return;
          const input = list.querySelector(`.date-input[data-id="${el.dataset.id}"]`);
          if (!input) return;
          try {
            if (typeof input.showPicker === 'function') input.showPicker();
            else input.click();
          } catch(e) { input.focus(); }
        });
      });
      list.querySelectorAll('.countdown-del').forEach(el => {
        el.addEventListener('click', () => {
          if (countdowns.length <= 1) return;
          countdowns = countdowns.filter(c => c.id !== el.dataset.id);
          saveCountdowns();
          renderCountdowns();
        });
      });
    }
    function addCountdown() {
      if (document.body.classList.contains('locked')) return;
      if (countdowns.length >= MAX_COUNTDOWNS) return;
      const id = 'c' + Date.now();
      countdowns.push({ id, label: 'NEW EVENT', date: '' });
      saveCountdowns();
      renderCountdowns();
    }

    // ==================== 鎖定模式 ====================
    function toggleLock() {
      document.body.classList.toggle('locked');
      const locked = document.body.classList.contains('locked');
      document.getElementById('lockBtn').textContent = locked ? '🔒' : '🔓';
      try { localStorage.setItem('dashboard-locked', locked ? '1' : '0'); } catch(e) {}
    }
    function loadLock() {
      try {
        if (localStorage.getItem('dashboard-locked') === '1') {
          document.body.classList.add('locked');
          document.getElementById('lockBtn').textContent = '🔒';
        }
      } catch(e) {}
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('calClock').textContent =
        String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }

    // ==================== 天氣 ====================
    const HKO_ICON = {
      50:'陽光充沛',51:'間中有陽光',52:'短暫陽光',53:'間中有陽光幾陣驟雨',
      54:'短暫陽光有驟雨',60:'多雲',61:'密雲',62:'微雨',63:'雨',64:'大雨',
      65:'狂風雷暴',70:'晴夜',71:'大致良好',72:'大致良好',76:'大致多雲',
      77:'大致多雲',80:'強烈季候風',90:'熱',91:'暖',92:'涼',93:'冷'
    };
    // iPhone Weather 風格 SVG（太陽黃橙、雲灰、雨藍灰，避免整組偏藍）
    const WX_SVG = {
      sun: '<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="12" fill="#FFB340"/><g stroke="#FFB340" stroke-width="3" stroke-linecap="round"><path d="M32 8v6M32 50v6M8 32h6M50 32h6M14 14l4.5 4.5M45.5 45.5L50 50M14 50l4.5-4.5M45.5 18.5L50 14"/></g></svg>',
      sunCloud: '<svg viewBox="0 0 64 64" fill="none"><circle cx="22" cy="22" r="9" fill="#FFB340"/><g stroke="#FFB340" stroke-width="2.5" stroke-linecap="round"><path d="M22 8v4M8 22h4M12 12l3 3"/></g><path d="M20 44c0-7 5.5-12 12.5-12 1.5-6 7-10 13.5-10 7.5 0 13.5 6 13.5 13.5 0 .5 0 1-.1 1.5 4.5 1 8 5 8 10 0 5.5-4.5 10-10 10H28c-4.4 0-8-3.6-8-8z" fill="#C7CDD6"/></svg>',
      cloud: '<svg viewBox="0 0 64 64" fill="none"><path d="M16 42c0-7 5.5-12 12.5-12 1.5-6 7-10 13.5-10 7.5 0 13.5 6 13.5 13.5 0 .5 0 1-.1 1.5 4.5 1 8 5 8 10 0 5.5-4.5 10-10 10H24c-4.4 0-8-3.6-8-8z" fill="#AEB6C2"/></svg>',
      rain: '<svg viewBox="0 0 64 64" fill="none"><path d="M16 36c0-7 5.5-12 12.5-12 1.5-6 7-10 13.5-10 7.5 0 13.5 6 13.5 13.5 0 .5 0 1-.1 1.5 4.5 1 8 5 8 10 0 5.5-4.5 10-10 10H24c-4.4 0-8-3.6-8-8z" fill="#AEB6C2"/><g stroke="#5B9FD4" stroke-width="2.5" stroke-linecap="round"><path d="M24 50v6M32 48v8M40 50v6"/></g></svg>',
      storm: '<svg viewBox="0 0 64 64" fill="none"><path d="M16 34c0-7 5.5-12 12.5-12 1.5-6 7-10 13.5-10 7.5 0 13.5 6 13.5 13.5 0 .5 0 1-.1 1.5 4.5 1 8 5 8 10 0 5.5-4.5 10-10 10H24c-4.4 0-8-3.6-8-8z" fill="#8E97A5"/><path d="M30 42l-4 10h6l-2 10 10-14h-6l4-6z" fill="#FFD60A"/></svg>',
      moon: '<svg viewBox="0 0 64 64" fill="none"><path d="M40 12a20 20 0 1 0 12 32A16 16 0 1 1 40 12z" fill="#E8ECF0"/></svg>',
      wind: '<svg viewBox="0 0 64 64" fill="none"><g stroke="#8E97A5" stroke-width="3" stroke-linecap="round"><path d="M10 24h32a6 6 0 1 0-6-6"/><path d="M10 34h38a6 6 0 1 1-6 6"/><path d="M10 44h24a5 5 0 1 0-5-5"/></g></svg>',
      hot: '<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="12" fill="#FF9F0A"/><g stroke="#FF9F0A" stroke-width="3" stroke-linecap="round"><path d="M32 6v8M32 50v8M6 32h8M50 32h8M14 14l5 5M45 45l5 5M14 50l5-5M45 19l5-5"/></g></svg>',
      cold: '<svg viewBox="0 0 64 64" fill="none"><g stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round"><path d="M32 10v44M18 18l14 14 14-14M18 46l14-14 14 14M10 32h44"/></g></svg>',
      fog: '<svg viewBox="0 0 64 64" fill="none"><g stroke="#AEB6C2" stroke-width="3" stroke-linecap="round"><path d="M12 24h40M16 34h32M14 44h36"/></g></svg>'
    };
    function wxIconKey(code) {
      const map = {
        50:'sun',51:'sunCloud',52:'sunCloud',53:'rain',54:'rain',
        60:'cloud',61:'cloud',62:'rain',63:'rain',64:'storm',
        65:'storm',70:'moon',71:'sunCloud',72:'sunCloud',76:'cloud',
        77:'cloud',80:'wind',90:'hot',91:'sun',92:'cold',93:'cold'
      };
      return map[code] || 'sunCloud';
    }
    function wxIconFromText(text) {
      if (!text) return 'sunCloud';
      if (text.includes('雷')) return 'storm';
      if (text.includes('大雨') || text.includes('暴雨')) return 'storm';
      if (text.includes('雨')) return 'rain';
      if (text.includes('晴') || text.includes('陽')) return 'sun';
      if (text.includes('雲')) return 'cloud';
      if (text.includes('霧')) return 'fog';
      if (text.includes('風')) return 'wind';
      if (text.includes('冷') || text.includes('涼')) return 'cold';
      if (text.includes('熱')) return 'hot';
      return 'sunCloud';
    }
    function wxSvg(key) { return WX_SVG[key] || WX_SVG.sunCloud; }

    async function updateWeather() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await res.json();
        const shatin = data.temperature?.data?.find(d => d.place === '沙田');
        document.getElementById('temp').textContent = (shatin?.value ?? '--') + '°';
        document.getElementById('humidity').textContent = (data.humidity?.data?.[0]?.value ?? '--') + '%';
        const uv = data.uvindex?.data?.[0];
        document.getElementById('uv').textContent = uv ? `${uv.value} (${uv.desc})` : '—';
        const rain = data.rainfall?.data?.find(d => d.place === '沙田');
        document.getElementById('rain').textContent = (rain?.max ?? 0) + ' mm';
        const iconCode = data.icon?.[0];
        document.getElementById('weatherDesc').textContent = HKO_ICON[iconCode] || ('Icon ' + iconCode);
        document.getElementById('weatherIcon').innerHTML = wxSvg(wxIconKey(iconCode));
        if (data.updateTime) {
          const t = new Date(data.updateTime);
          document.getElementById('wxUpdate').textContent =
            String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
        }
        document.getElementById('feels').textContent = '沙田 · 香港天文台';
        const warn = data.warningMessage;
        const warnEl = document.getElementById('weatherWarning');
        if (warn && warn.length) {
          const msg = Array.isArray(warn) ? warn.join('；') : String(warn);
          if (msg.trim()) {
            warnEl.textContent = '⚠️ ' + msg;
            warnEl.classList.add('show');
          } else {
            warnEl.classList.remove('show');
          }
        } else {
          warnEl.classList.remove('show');
        }
      } catch (e) {
        document.getElementById('weatherDesc').textContent = '天氣暫時無法更新';
      }
      try {
        const res2 = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        const fnd = await res2.json();
        const list = (fnd.weatherForecast || []).slice(0, 5);
        const weekMap = { '星期一':'一','星期二':'二','星期三':'三','星期四':'四','星期五':'五','星期六':'六','星期日':'日' };
        document.getElementById('forecastRow').innerHTML = list.map(d => {
          const week = weekMap[d.week] || d.week?.slice(-1) || '';
          const maxT = d.forecastMaxtemp?.value ?? '--';
          const minT = d.forecastMintemp?.value ?? '--';
          const key = d.ForecastIcon ? wxIconKey(d.ForecastIcon) : wxIconFromText(d.forecastWeather);
          return `<div class="forecast-day">
            <div class="fd-week">${week}</div>
            <div class="fd-icon">${wxSvg(key)}</div>
            <div class="fd-temp">${minT}~${maxT}°</div>
          </div>`;
        }).join('');
      } catch (e) {
        document.getElementById('forecastRow').innerHTML = '';
      }
    }

    // ==================== Google Calendar ====================
    function renderEvents(events) {
      const list = document.getElementById('schedule');
      if (!events || events.length === 0) {
        list.innerHTML = '<div style="color:var(--muted);font-size:0.9rem;padding:4px 0;">No events today</div>';
        document.getElementById('calPreview').textContent = 'No events today';
        return;
      }
      document.getElementById('calPreview').textContent = events.length + ' event' + (events.length > 1 ? 's' : '') + ' today';
      list.innerHTML = events.map(e => {
        const cls = e.cancelled ? 'event-item cancelled' : 'event-item';
        const time = e.end ? `${e.start} – ${e.end}` : e.start;
        return `<div class="${cls}">
          <div class="event-dot"></div>
          <div><div class="event-time">${time}</div><div class="event-title">${e.title}</div></div>
        </div>`;
      }).join('');
    }

    async function tryLoadCalendar() {
      if (!GOOGLE_CAL_PROXY_URL) {
        document.getElementById('calStatus').textContent = '手動模式';
        renderEvents([]);
        return;
      }
      try {
        const res = await fetch(GOOGLE_CAL_PROXY_URL + '?t=' + Date.now());
        const events = await res.json();
        if (Array.isArray(events)) {
          renderEvents(events);
          document.getElementById('calStatus').textContent =
            '已同步 · ' + new Date().toLocaleTimeString('zh-HK', {hour:'2-digit', minute:'2-digit'});
        } else {
          renderEvents([]);
          document.getElementById('calStatus').textContent = '今日無行程';
        }
      } catch (e) {
        document.getElementById('calStatus').textContent = '同步失敗';
        renderEvents([]);
      }
    }

    function scheduleDailyRefresh() {
      const now = new Date();
      const target = new Date();
      target.setHours(6, 0, 0, 0);
      if (now > target) target.setDate(target.getDate() + 1);
      setTimeout(() => {
        tryLoadCalendar();
        setInterval(tryLoadCalendar, 24 * 60 * 60 * 1000);
      }, target - now);
    }

    // ==================== Init ====================
    function showError(msg) {
      var el = document.getElementById('jsError');
      if (!el) {
        el = document.createElement('div');
        el.id = 'jsError';
        el.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#fee2e2;color:#991b1b;padding:10px 12px;border-radius:8px;font-size:12px;';
        document.body.appendChild(el);
      }
      el.textContent = 'JS Error: ' + msg;
    }
    window.onerror = function(msg, src, line) {
      showError(String(msg) + ' (line ' + line + ')');
    };

    function boot() {
      try {
        renderCalendarWidget();
        updateClock();
        loadRoutes();
        loadLock();
        updateShuttles();
        loadCountdowns();
        updateWeather();
        tryLoadCalendar();
        scheduleDailyRefresh();
        setInterval(function() {
          renderCalendarWidget();
          updateShuttles();
          renderCountdowns();
        }, 30000);
        setInterval(updateClock, 1000);
        setInterval(updateWeather, 15 * 60 * 1000);
        setInterval(tryLoadCalendar, 30 * 60 * 1000);
      } catch (e) {
        showError(e && e.message ? e.message : String(e));
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  </script>
</body>
</html>
